# D:\CuriosityGraphAI_Backend\docker-compose.yml

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # This maps the container's data folder to your actual Windows folder.
      # Your SQLite DB, uploaded PDFs, AND the cached AI model will be saved here!
      - ./data:/app/data
    environment:
      - INGESTION_SYNC=false

  frontend:
    build:
      # Point to the frontend folder (assuming it's next to the backend folder)
      context: C:/Users/This Pc/Downloads/CuriosityGraphAI_Frontend
      dockerfile: Dockerfile
      args:
        # Tell the React build where the backend lives
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend